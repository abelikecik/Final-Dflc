<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divine Favor Learning Center</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#182230}header{background:#12355b;color:white;padding:20px;text-align:center}main{max-width:900px;margin:20px auto;padding:10px}.card{background:white;padding:20px;margin:15px 0;border-radius:10px}input,select,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#12355b;color:white;border:0;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.hidden{display:none}</style></head><body><header><h1>Divine Favor Learning Center</h1><div>Student Results Portal</div></header><main><section class="card"><h2>Parent / Student Lookup</h2><div class="grid"><select id="pc"></select><select id="pt"><option>First Term</option><option>Second Term</option><option>Third Term</option></select><input id="pr" type="number" placeholder="Register number"><input id="py" type="number"></div><button onclick="lookup()">View Result</button><div id="out"></div></section><section class="card"><h2>Staff Login</h2><select id="role"><option value="teacher">Teacher</option><option value="owner">Owner</option></select><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lm"></p></section><section id="dash" class="card hidden"><h2>Dashboard</h2><p id="who"></p><h3>Add Student (Teacher)</h3><input id="rn" type="number" placeholder="Register number"><input id="sn" placeholder="Student full name"><button onclick="addStudent()">Add Student</button><h3>Students</h3><div id="students"></div><button onclick="logout()">Logout</button></section></main><script>const $=x=>document.getElementById(x);let me;async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function init(){try{let c=await api('/api/classes');$('pc').innerHTML=c.map(x=>`<option>${x.name}</option>`).join('');$('py').value=new Date().getFullYear()}catch(e){$('out').textContent=e.message}}async function login(){try{me=await api($('role').value==='owner'?'/api/login/owner':'/api/login/staff',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});$('dash').classList.remove('hidden');$('who').textContent='Logged in: '+me.role+(me.class_name?' — '+me.class_name:'');load()}catch(e){$('lm').textContent=e.message}}async function load(){try{$('students').textContent=JSON.stringify(await api('/api/students'))}catch(e){$('students').textContent=e.message}}async function addStudent(){try{await api('/api/students',{method:'POST',body:JSON.stringify({registerNo:$('rn').value,fullName:$('sn').value})});load()}catch(e){alert(e.message)}}async function lookup(){try{let d=await api('/api/login/parent',{method:'POST',body:JSON.stringify({className:$('pc').value,term:$('pt').value,registerNo:$('pr').value,year:$('py').value})});$('out').innerHTML='<h3>'+d.full_name+'</h3><p>'+d.class_name+' • Register '+d.register_no+' • '+d.term+' • '+d.school_year+'</p><p>Total: '+d.total.toFixed(2)+' | Average: '+d.average.toFixed(2)+'</p>'}catch(e){$('out').textContent=e.message}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}init()</script></body></html>
